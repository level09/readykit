{% extends "layout.html" %}

{% block content %}
<v-container class="py-12 px-4" style="max-width: 560px">
    <div class="d-flex flex-column align-center text-center">
        <v-icon size="56" color="primary" class="mb-6">ti-circle-check</v-icon>
        <h1 class="text-h5 font-weight-bold mb-2">Your workspace is on Pro</h1>
        <p class="text-body-2 text-medium-emphasis mb-8">
            You can view or change the subscription at any time from Workspace Settings.
        </p>
        <v-btn color="primary" href="/workspace/settings/" class="text-none">
            Back to workspace
        </v-btn>
    </div>
</v-container>
{% endblock %}

{% block js %}
<script type="application/json" id="page-data">
{
    "success": {{ 'true' if success else 'false' }},
    "error": {{ error|tojson if error else 'null' }}
}
</script>

<script>
const {createApp} = Vue;
const {createVuetify} = Vuetify;
const vuetify = createVuetify(config.vuetifyConfig);

const pageData = JSON.parse(document.getElementById('page-data').textContent);

const app = createApp({
    data() {
        return {
            ...pageData
        };
    },
    mixins: [layoutMixin],
    delimiters: ['${', '}']
});

app.use(vuetify).mount('#app');
</script>
{% endblock %}
